<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEZZERS - World's Best Meme Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #1a1a1a;
            color: white;
        }

        /* Header Styles */
        .header {
            background: #FF1A1A;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            font-style: italic;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Main Content Grid */
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .meme-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .meme-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .views {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .meme-info {
            padding: 1rem;
        }

        .meme-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .metadata {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Footer Styles */
        .footer {
            background: #333;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .footer a {
            color: #ccc;
            text-decoration: none;
        }

        .disclaimer {
            color: #666;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">BLEZZERS</a>
        <nav class="nav-links">
            <a href="#" class="nav-link" data-category="enlighted">Enlighted</a>
            <a href="#" class="nav-link" data-category="blessed">Blessed</a>
            <a href="#" class="nav-link" data-category="monk">Monk</a>
            <a href="#" class="nav-link" data-category="cursed">Cursed</a>
        </nav>
    </header>

    <main class="meme-grid">
        <h2>CURSED Content</h2>
        <div class="meme-card">
            <div class="thumbnail">
                <img src="https://picsum.photos/300/200?random=2" alt="Meme">
                <div class="views">1.6B views</div>
            </div>
            <div class="meme-info">
                <h3 class="meme-title">Lock's doing thug shake uncensored (thumbnail is click-bait)</h3>
                <div class="metadata">
                    <span>Wholesome</span>
                    <span>1d ago</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <!-- Same footer -->
    </footer>

    <script>
        // Verify access
        const grantedAccess = sessionStorage.getItem('accessGranted');
        if(grantedAccess !== 'enlighted') {
            alert('Invalid access! Redirecting...');
            window.location.href = 'index.html';
        }

        // Clear access after 5 minutes
        setTimeout(() => {
            sessionStorage.removeItem('accessGranted');
        }, 300000);
    </script>
</body>
</html>
