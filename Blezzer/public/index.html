<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEZZERS - World's Best Meme Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #1a1a1a;
            color: white;
        }

        /* Header Styles */
        .header {
            background: #FF1A1A;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            font-style: italic;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .logo:hover {
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Main Content Grid */
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .meme-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .meme-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .views {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .meme-info {
            padding: 1rem;
        }

        .meme-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .metadata {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Footer Styles */
        .footer {
            background: #333;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .footer a {
            color: #ccc;
            text-decoration: none;
        }

        .disclaimer {
            color: #666;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">BLEZZERS</a>
        <nav class="nav-links">
            <a href="#" class="nav-link" data-category="enlighted">Enlighted</a>
            <a href="#" class="nav-link" data-category="blessed">Blessed</a>
            <a href="#" class="nav-link" data-category="monk">Monk</a>
            <a href="#" class="nav-link" data-category="cursed">Cursed</a>
        </nav>
    </header>

    <main class="meme-grid">
        <!-- Meme Cards -->
        <div class="meme-card">
            <div class="thumbnail">
                <img src="https://picsum.photos/300/200?random=1" alt="Meme">
                <div class="views">1.2M views</div>
            </div>
            <div class="meme-info">
                <h3 class="meme-title">Vin banging on LonelyGuy 4k</h3>
                <div class="metadata">
                    <span>Dank</span>
                    <span>8h ago</span>
                </div>
            </div>
        </div>

        <!-- Repeat more cards (change random number in img src) -->
        <div class="meme-card">
            <div class="thumbnail">
                <img src="https://picsum.photos/300/200?random=2" alt="Meme">
                <div class="views">850K views</div>
            </div>
            <div class="meme-info">
                <h3 class="meme-title">Monday Mood</h3>
                <div class="metadata">
                    <span>Wholesome</span>
                    <span>1d ago</span>
                </div>
            </div>
        </div>

        <!-- Add 10 more meme-card elements with different random images -->
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </div>
        <div class="disclaimer">
            © 2025 BLEZZERS - World's Best HD Corn Site!
        </div>
    </footer>

    <script>
        const ACCESS_KEYS = {
            enlighted: "enlighted10",
            blessed: "blessed25",
            monk: "monk40",
            cursed: "vinnie",  // vinnie is both cursed password and universal
            universal: "vinnie" // Master key
        };
    
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const category = e.target.dataset.category;
                const password = prompt(`Please submit ${capitalizeFirstLetter(category)} permission:`);
                
                // Check both category-specific and universal password
                if(password === ACCESS_KEYS[category] || password === ACCESS_KEYS.universal) {
                    sessionStorage.setItem('accessGranted', category);
                    window.location.href = `${category}.html`;
                } else {
                    alert('Access Declined: Invalid permission code!');
                }
            });
        });
    
        function capitalizeFirstLetter(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }
    </script>
</body>
</html>
